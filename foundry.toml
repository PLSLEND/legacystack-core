[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
auto_detect_solc = true
sparse_mode = false
optimizer = true
optimizer_runs = 100
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]
[profile.default.fuzz]
runs = 256
[profile.default.invariant]
runs = 64
depth = 32
